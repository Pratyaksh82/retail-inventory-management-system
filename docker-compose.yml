version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app
    stdin_open: true
    tty: true
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=retail_inventory
      - DB_USER=root
      - DB_PASS=secret123
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - inventory-net

  mysql-db:
    image: mysql:8.0
    container_name: inventory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_DATABASE: retail_inventory
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge

volumes:
  mysql-data:
